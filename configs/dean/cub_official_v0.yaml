version: dean-cub-official-v0
mode: official
status: NOT RUN
upstream:
  url: https://github.com/KU-VGI/OCGCD.git
  sha: 28b9384cd7ea9b123b03d045bac2e92d8d0b2870
  branch: main
result_namespace: dean/official/cub_v0
seeds: [1, 3, 8, 2, 4]
protocol:
  known_classes: first_160_zero_based
  novel_classes: last_40_zero_based
  labelled_fraction: 0.8
  labelled_sampling: per_class_floor_numpy_seed0
  incremental_sessions: 1
  novel_schedule: all_40_in_session1
  stream: shuffled_batches_64
  incremental_epochs_per_batch: 15
  base_epochs: 30
  estimated_novel_count: affinity_propagation_with_VFA_then_GMM
  test_selection: upstream_base_best_test_accuracy
  ssb_compliant: false
core:
  entrypoint: Ours_train_online.py
  backbone: DINOv1_ViT_B_16
  embedding_dim: 768
  lora_layers: [7, 8, 9, 10, 11]
  lora_rank: 5
  use_EC: true
  use_VFA: true
  n_replay: 5
  energy_hp: 1.0
differences:
  - Runtime-only replacement of the single hard-coded dataset-parent literal.
  - Explicit checkpoint and log paths; isolated output cwd and experiment name.
  - Seeds run in separate subprocesses and result directories; provenance added.
